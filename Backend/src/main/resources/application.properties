spring.application.name=talentcircle
server.port=${PORT:8080}

# Configuración Dinámica de Base de Datos
# Si las variables DB_ no existen, usa los valores por defecto (localhost, 5432, etc.)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:talent}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración Regional (Mantenida según tu original)
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# Pruebas y Seguridad
spring.test.database.replace=none
jwt.secret=${JWT_SECRET:mi_clave_secreta_temporal_de_32_caracteres_minimo}

# Actuator y Salud del Sistema (Probes para Docker/Kubernetes)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Configuración de Archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Optimización de Conexiones (Hikari)
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.maxLifetime=1800000

# Debug y Versión
logging.level.org.springframework.security=DEBUG
java.runtime.version=21

# CONFIGURACIÓN DE ACCESO A LA API
spring.security.user.name=admin
spring.security.user.password=admin