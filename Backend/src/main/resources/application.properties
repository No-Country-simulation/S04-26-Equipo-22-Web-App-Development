spring.application.name=talentcircle
server.port=${PORT:8080}

# --- Database Dynamic Configuration ---
# Uses environment variables or defaults if not present
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:talent}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.initializationFailTimeout=0
spring.datasource.hikari.connectionTimeout=30000

# --- JPA / Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Regional Configuration (Buenos Aires, Argentina) ---
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# --- Security ---
app.jwt.secret=${JWT_SECRET:temporary_secret_key_at_least_32_characters_long}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# --- Actuator & Health Checks (Docker/Kubernetes Probes) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# --- File Upload Settings ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Hikari Connection Pool Optimization ---
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.maxLifetime=1800000

# --- Logging & Debugging ---
logging.level.org.springframework.security=DEBUG
java.runtime.version=21

# --- API ACCESS CREDENTIALS (Temporary) ---
spring.security.user.name=admin
spring.security.user.password=admin
