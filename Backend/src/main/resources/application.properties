spring.application.name=talentcircle
server.port=${PORT:8080}

# --- CONFIGURACIÓN DE BASE DE DATOS (CORREGIDA) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/talent
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Eliminamos el dialecto explícito para que Spring lo detecte solo y no tire el WARN que vimos antes
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de Horarios
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires
spring.jackson.time-zone=America/Argentina/Buenos_Aires

# Seguridad y JWT
spring.test.database.replace=none
# Le agregamos un valor por defecto para que no falle si no tenés la variable de entorno
jwt.secret=${JWT_SECRET:mi_clave_secreta_temporal_de_32_caracteres_minimo}

# Monitoreo (Actuator)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Manejo de archivos (Lencería/Imágenes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Optimización de Conexiones (Hikari)
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.maxLifetime=1800000

# Logs de seguridad para ver qué pasa con el login
logging.level.org.springframework.security=DEBUG
java.runtime.version=21