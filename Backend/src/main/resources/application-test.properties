# --- DATABASE (H2 TEST) ---
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.nocountry.webapp=DEBUG

# --- Security ---
app.jwt.secret=test_secret_key_12345678901234567890

spring.test.database.replace=none

# Disable Gemini AI in tests

spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.google.genai.GoogleGenAiAutoConfiguration