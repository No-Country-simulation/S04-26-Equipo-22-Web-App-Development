services:
  db:
    image: postgres:15-alpine
    container_name: postgres_talent

    environment:
      POSTGRES_DB: talent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - '5433:5432'

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d talent']
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - talent_network

  app:
    build: .
    container_name: talent_circle_backend

    ports:
      - '8080:8080'

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: talent
      DB_USER: postgres
      DB_PASSWORD: postgres

    depends_on:
      - db

    networks:
      - talent_network

networks:
  talent_network:
    driver: bridge
