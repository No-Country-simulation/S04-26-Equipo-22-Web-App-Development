services:
  db:
    image: postgres:15-alpine
    container_name: postgres_talent
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-talent}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}

    ports:
      - '5433:5432'

    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - talent_network

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-talent}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
    container_name: talent_backend
    restart: unless-stopped

    ports:
      - '8080:8080'

    env_file:
      - ./Backend/.env

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-talent}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - talent_network

  frontend:
    build:
      context: ./Frontend
    container_name: talent_frontend
    restart: unless-stopped

    ports:
      - '5175:5173'

    environment:
      VITE_API_URL: http://localhost:8080
      CHOKIDAR_USEPOLLING: 'true'

    volumes:
      - ./Frontend:/app
      - /app/node_modules

    depends_on:
      - backend

    networks:
      - talent_network

networks:
  talent_network:
    driver: bridge

volumes:
  pgdata:
