services:
  db:
    image: postgres:15-alpine
    container_name: postgres_talent
    restart: unless-stopped

    environment:
      POSTGRES_DB: talent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - '5433:5432'

    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - talent_network

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d talent']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
    container_name: talent_backend
    restart: unless-stopped

    ports:
      - '8080:8080'

    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: talent
      DB_USER: postgres
      DB_PASSWORD: postgres

    depends_on:
      db:
        condition: service_healthy

    networks:
      - talent_network

  frontend:
    build:
      context: ./Frontend
    container_name: talent_frontend
    restart: unless-stopped

    ports:
      - '5173:5173'

    environment:
      VITE_API_URL: http://localhost:8080

    depends_on:
      - backend

    networks:
      - talent_network

networks:
  talent_network:
    driver: bridge

volumes:
  pgdata:
